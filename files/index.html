<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Painel de pedidos — MAD.U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("madu-tema"); } catch (e) {}
  if (t !== "claro" && t !== "escuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
  document.documentElement.setAttribute("data-tema", t);
})();
</script>
<style>
  :root { --laranja:#ffa028; --laranja-esc:#f08c0a; --lavanda:#4a4a8c; --tinta:#1d1d1f; --suave:#6e6e73; --fundo:#fff; --faixa:#f5f5f7; --card:#fff; --linha:rgba(0,0,0,.1); --glass:rgba(255,255,255,.72); --erro:#c9382f; --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light; }
  html[data-tema="escuro"] { --tinta:#f5f5f7; --suave:#a1a1a6; --fundo:#000; --faixa:#1d1d1f; --card:#1c1c1e; --linha:rgba(255,255,255,.14); --glass:rgba(0,0,0,.72); --lavanda:#b9b9f2; --erro:#ff7a70; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:var(--fundo); color:var(--tinta); font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button,input { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--lavanda); outline-offset:3px; }
  header { position:sticky; top:0; z-index:5; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border-bottom:1px solid var(--linha); padding-top:env(safe-area-inset-top,0px); }
  .topo { max-width:1120px; margin:0 auto; height:56px; padding:0 24px; display:flex; align-items:center; gap:16px; }
  .marca { font-weight:900; font-size:1.5rem; letter-spacing:-.01em; color:var(--laranja); text-decoration:none; }
  .atual { margin-left:auto; font-size:.78rem; color:var(--suave); }
  .tema, .sair { height:40px; border:0; border-radius:999px; background:var(--faixa); cursor:pointer; }
  .tema { width:40px; display:grid; place-items:center; flex:none; }
  .sair { padding:0 16px; font-size:.82rem; font-weight:600; }
  .tema svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tema .sol { display:none; } html[data-tema="escuro"] .tema .sol { display:block; } html[data-tema="escuro"] .tema .lua { display:none; }
  main { max-width:1120px; margin:0 auto; padding:clamp(32px,7vw,72px) 24px 64px; }
  h1 { margin:0; font-size:clamp(2.1rem,6vw,3.6rem); font-weight:900; line-height:1.05; letter-spacing:-.035em; }
  .sub { margin:14px 0 0; max-width:38em; font-size:1.05rem; line-height:1.55; color:var(--suave); }

  .login { max-width:420px; margin-top:32px; display:grid; gap:12px; }
  .login input { min-height:52px; padding:0 18px; border:1px solid var(--linha); border-radius:14px; background:var(--faixa); font-size:1rem; font-weight:600; }
  .btn { min-height:48px; border:2px solid var(--laranja); border-radius:999px; background:var(--laranja); color:#1d1d1f; font-weight:900; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; transition:transform .25s var(--ease), background .25s; }
  .btn:hover { background:var(--laranja-esc); border-color:var(--laranja-esc); } .btn:active { transform:scale(.97); }
  .erro { margin:0; font-size:.86rem; color:var(--erro); }

  .filtros { margin-top:28px; display:flex; flex-wrap:wrap; gap:8px; }
  .filtros button { min-height:40px; padding:0 18px; border:1px solid var(--linha); border-radius:999px; background:var(--faixa); font-size:.84rem; font-weight:600; cursor:pointer; }
  .filtros button[aria-pressed="true"] { background:var(--tinta); color:var(--fundo); border-color:var(--tinta); }

  .meta { margin-top:20px; padding:24px; border-radius:24px; background:var(--faixa); }
  .meta h2 { margin:0; font-size:.95rem; font-weight:600; color:var(--suave); }
  .meta .grande { margin:6px 0 0; font-size:clamp(2rem,5.5vw,3.2rem); font-weight:900; letter-spacing:-.03em; }
  .trilho { position:relative; margin:18px 0 10px; height:16px; border-radius:999px; background:var(--card); border:1px solid var(--linha); }
  .trilho i { position:absolute; inset:0 auto 0 0; border-radius:999px; background:var(--laranja); transition:width .8s var(--ease); }
  .trilho u { position:absolute; top:-6px; bottom:-6px; width:3px; background:var(--lavanda); border-radius:2px; }
  .legenda { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 18px; font-size:.84rem; color:var(--suave); }
  .legenda b { color:var(--tinta); font-weight:600; }

  .kpis { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .kpi { padding:18px 20px; border-radius:20px; border:1px solid var(--linha); background:var(--card); }
  .kpi span { display:block; font-size:.8rem; font-weight:600; color:var(--suave); }
  .kpi b { display:block; margin-top:4px; font-size:1.5rem; font-weight:900; letter-spacing:-.02em; }

  .grade { margin-top:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr)); gap:14px; align-items:start; }
  .bloco { padding:22px; border-radius:24px; border:1px solid var(--linha); background:var(--card); }
  .bloco-topo { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
  .bloco h2 { margin:0; font-size:1.05rem; font-weight:600; }
  .seg { display:flex; gap:4px; padding:3px; border-radius:999px; background:var(--faixa); }
  .seg button { min-height:32px; padding:0 14px; border:0; border-radius:999px; background:transparent; font-size:.78rem; font-weight:600; color:var(--suave); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--tinta); color:var(--fundo); }
  .rank { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .rank li { display:grid; grid-template-columns:1fr auto; gap:2px 12px; font-size:.88rem; }
  .rank .nome { font-weight:600; overflow-wrap:anywhere; }
  .rank .ref { font-size:.74rem; color:var(--suave); font-weight:400; }
  .rank .val { font-weight:600; text-align:right; white-space:nowrap; }
  .rank .val small { display:block; font-size:.74rem; color:var(--suave); font-weight:400; }
  .barra { grid-column:1 / -1; height:6px; border-radius:99px; background:var(--faixa); overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:99px; background:var(--laranja); }
  .barra.lav i { background:var(--lavanda); }
  svg.dias { width:100%; height:auto; display:block; }
  svg.dias rect { fill:var(--laranja); } svg.dias rect:hover { fill:var(--laranja-esc); }
  svg.dias text { fill:var(--suave); font-size:11px; font-family:inherit; }
  .vazio { margin:0; font-size:.9rem; color:var(--suave); }
  .nota { margin:32px 0 0; padding:18px 20px; border-radius:20px; background:var(--faixa); font-size:.84rem; line-height:1.6; color:var(--suave); }
  @media (max-width:600px) { .topo, main { padding-left:16px; padding-right:16px; } .atual { display:none; } .tema { margin-left:auto; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header>
  <div class="topo">
    <a class="marca" href="https://www.pensemadu.com.br/" aria-label="MAD.U">MAD.U</a>
    <span class="atual" id="atual"></span>
    <button type="button" class="sair" id="btnSair" hidden>Sair</button>
    <button type="button" class="tema" id="btnTema" aria-pressed="false" aria-label="Ativar modo escuro" title="Modo escuro">
      <svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="telaLogin">
    <h1>Painel de pedidos</h1>
    <p class="sub">Digite a senha do time para ver as vendas da loja.</p>
    <form class="login" id="form" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
      <p class="erro" id="erro" role="alert" hidden></p>
    </form>
  </section>

  <section id="painel" hidden>
    <h1>Vendas da loja</h1>
    <div class="filtros" id="filtros" role="group" aria-label="Período">
      <button type="button" data-p="mes" aria-pressed="true">Este mês</button>
      <button type="button" data-p="30" aria-pressed="false">Últimos 30 dias</button>
      <button type="button" data-p="tudo" aria-pressed="false">Tudo</button>
    </div>
    <div class="meta" id="meta" hidden></div>
    <div class="kpis" id="kpis"></div>
    <div class="grade">
      <section class="bloco">
        <div class="bloco-topo"><h2>Itens mais vendidos</h2>
          <div class="seg" id="ordem" role="group" aria-label="Ordenar itens"><button type="button" data-o="qtd" aria-pressed="true">Unidades</button><button type="button" data-o="valor" aria-pressed="false">Valor</button></div>
        </div>
        <ol class="rank" id="itens"></ol>
      </section>
      <section class="bloco"><div class="bloco-topo"><h2>Vendas por dia</h2></div><div id="dias"></div></section>
      <section class="bloco"><div class="bloco-topo"><h2>Estados</h2></div><ol class="rank" id="estados"></ol></section>
      <section class="bloco"><div class="bloco-topo"><h2>Formas de pagamento</h2></div><ol class="rank" id="pagto"></ol></section>
    </div>
    <p class="nota">Pedidos cancelados não entram nas contas. Os dados vêm da VTEX e não incluem nome, telefone nem e-mail dos clientes.</p>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var raiz = document.documentElement;

  /* Metas por mês: [meta, meta MAD.U+]. Atualize aqui a cada mês. */
  var METAS = { "Novembro": [25000, 65000] };

  /* tema */
  function tema(t, salvar) {
    var e = t === "escuro";
    raiz.setAttribute("data-tema", t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", e ? "#000000" : "#ffffff");
    $("btnTema").setAttribute("aria-pressed", e ? "true" : "false");
    $("btnTema").setAttribute("aria-label", e ? "Desativar modo escuro" : "Ativar modo escuro");
    if (salvar) { try { localStorage.setItem("madu-tema", t); } catch (x) {} }
  }
  tema(raiz.getAttribute("data-tema"), false);
  $("btnTema").addEventListener("click", function () { tema(raiz.getAttribute("data-tema") === "escuro" ? "claro" : "escuro", true); });

  /* descriptografia (PBKDF2 + AES-GCM) */
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function abrir(senha) {
    var r = await fetch("data/pedidos.enc.json", { cache: "no-store" });
    if (!r.ok) throw new Error("sem-dados");
    var j = await r.json();
    var mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    var k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(j.salt), iterations: 250000, hash: "SHA-256" }, mat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var t;
    try { t = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(j.iv) }, k, b64(j.dados)); }
    catch (e) { throw new Error("senha"); }
    return JSON.parse(new TextDecoder().decode(t));
  }

  /* util */
  var BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  var NUM = new Intl.NumberFormat("pt-BR");
  function dia(iso) { return new Date(iso).toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var base = [], periodo = "mes", ordem = "qtd";

  function filtrar() {
    var hoje = dia(new Date().toISOString()), lim30 = dia(new Date(Date.now() - 30 * 864e5).toISOString());
    return base.filter(function (o) {
      if (o.status === "canceled") return false;
      var d = dia(o.data);
      if (periodo === "mes") return d.slice(0, 7) === hoje.slice(0, 7);
      if (periodo === "30") return d >= lim30;
      return true;
    });
  }

  function agrupar(lista, chave, valor) {
    var m = {};
    lista.forEach(function (x) { var k = chave(x) || "Sem informação"; (m[k] = m[k] || { k: k, v: 0, n: 0 }); m[k].v += valor(x); m[k].n++; });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.v - a.v; });
  }

  function lista(el, linhas, fmtV, fmtS, lav) {
    if (!linhas.length) { el.innerHTML = "<li class='vazio'>Sem pedidos neste período.</li>"; return; }
    var max = linhas[0].v || 1;
    el.innerHTML = linhas.map(function (l) {
      return "<li><span class='nome'>" + esc(l.k) + (l.ref ? "<br><span class='ref'>" + esc(l.ref) + "</span>" : "") + "</span>" +
        "<span class='val'>" + fmtV(l) + "<small>" + fmtS(l) + "</small></span>" +
        "<div class='barra" + (lav ? " lav" : "") + "'><i style='width:" + Math.max(2, l.v / max * 100) + "%'></i></div></li>";
    }).join("");
  }

  function desenhar() {
    var L = filtrar();
    var fat = L.reduce(function (s, o) { return s + o.valor; }, 0);
    var un = L.reduce(function (s, o) { return s + o.itens.reduce(function (a, i) { return a + i.qtd; }, 0); }, 0);

    /* meta do mês */
    var mesNome = new Date().toLocaleDateString("pt-BR", { month: "long", timeZone: "America/Sao_Paulo" });
    mesNome = mesNome.charAt(0).toUpperCase() + mesNome.slice(1);
    var m = METAS[mesNome], box = $("meta");
    if (periodo === "mes" && m) {
      var topo = Math.max(m[1], fat);
      box.hidden = false;
      box.innerHTML = "<h2>Meta de " + mesNome + "</h2><p class='grande'>" + BRL.format(fat) + "</p>" +
        "<div class='trilho'><i style='width:" + Math.min(100, fat / topo * 100) + "%'></i><u style='left:" + (m[0] / topo * 100) + "%' title='Meta'></u></div>" +
        "<div class='legenda'><span>Meta <b>" + BRL.format(m[0]) + "</b>: <b>" + Math.round(fat / m[0] * 100) + "%</b></span><span>Meta MAD.U+ <b>" + BRL.format(m[1]) + "</b>: <b>" + Math.round(fat / m[1] * 100) + "%</b></span></div>";
    } else box.hidden = true;

    $("kpis").innerHTML =
      "<div class='kpi'><span>Faturamento</span><b>" + BRL.format(fat) + "</b></div>" +
      "<div class='kpi'><span>Pedidos</span><b>" + NUM.format(L.length) + "</b></div>" +
      "<div class='kpi'><span>Ticket médio</span><b>" + BRL.format(L.length ? fat / L.length : 0) + "</b></div>" +
      "<div class='kpi'><span>Unidades vendidas</span><b>" + NUM.format(un) + "</b></div>";

    /* itens */
    var mp = {};
    L.forEach(function (o) { o.itens.forEach(function (i) {
      var k = i.nome || i.ref; (mp[k] = mp[k] || { k: k, ref: i.ref, qtd: 0, valor: 0 });
      mp[k].qtd += i.qtd; mp[k].valor += i.qtd * i.preco;
    }); });
    var itens = Object.keys(mp).map(function (k) { return mp[k]; }).sort(function (a, b) { return b[ordem] - a[ordem]; }).slice(0, 10)
      .map(function (x) { return { k: x.k, ref: x.ref, v: x[ordem], qtd: x.qtd, valor: x.valor }; });
    lista($("itens"), itens,
      function (l) { return ordem === "qtd" ? NUM.format(l.qtd) + (l.qtd === 1 ? " un." : " un.") : BRL.format(l.valor); },
      function (l) { return ordem === "qtd" ? BRL.format(l.valor) : NUM.format(l.qtd) + " un."; });

    /* estados e pagamento */
    lista($("estados"), agrupar(L, function (o) { return o.estado; }, function (o) { return o.valor; }).slice(0, 8),
      function (l) { return BRL.format(l.v); }, function (l) { return l.n + (l.n === 1 ? " pedido" : " pedidos"); }, true);
    lista($("pagto"), agrupar(L, function (o) { return o.pagamento; }, function (o) { return o.valor; }).slice(0, 6),
      function (l) { return BRL.format(l.v); }, function (l) { return l.n + (l.n === 1 ? " pedido" : " pedidos"); }, true);

    /* vendas por dia */
    var porDia = {}; L.forEach(function (o) { var d = dia(o.data); porDia[d] = (porDia[d] || 0) + o.valor; });
    var ds = Object.keys(porDia).sort();
    if (!ds.length) { $("dias").innerHTML = "<p class='vazio'>Sem pedidos neste período.</p>"; return; }
    var seq = [], d0 = new Date(ds[0] + "T12:00:00"), d1 = new Date(ds[ds.length - 1] + "T12:00:00");
    for (var d = d0; d <= d1; d = new Date(d.getTime() + 864e5)) seq.push(d.toLocaleDateString("sv-SE"));
    var mx = Math.max.apply(null, seq.map(function (s) { return porDia[s] || 0; })) || 1;
    var W = 600, H = 150, bw = W / seq.length, svg = "<svg class='dias' viewBox='0 0 " + W + " " + (H + 22) + "' role='img' aria-label='Vendas por dia'>";
    seq.forEach(function (s, i) {
      var v = porDia[s] || 0, h = v / mx * H;
      svg += "<rect x='" + (i * bw + 1) + "' y='" + (H - h) + "' width='" + Math.max(1, bw - 2) + "' height='" + h + "' rx='2'><title>" + s.split("-").reverse().join("/") + ": " + BRL.format(v) + "</title></rect>";
    });
    svg += "<text x='0' y='" + (H + 16) + "'>" + seq[0].split("-").reverse().slice(0, 2).join("/") + "</text>" +
           "<text x='" + W + "' y='" + (H + 16) + "' text-anchor='end'>" + seq[seq.length - 1].split("-").reverse().slice(0, 2).join("/") + "</text></svg>" +
           "<p class='vazio'>Melhor dia: " + BRL.format(mx) + "</p>";
    $("dias").innerHTML = svg;
  }

  function mostrar(dados) {
    base = dados.pedidos;
    $("atual").textContent = "Atualizado em " + new Date(dados.atualizado).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });
    $("telaLogin").hidden = true; $("painel").hidden = false; $("btnSair").hidden = false;
    desenhar();
  }

  $("filtros").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    periodo = b.dataset.p;
    [].forEach.call($("filtros").children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    desenhar();
  });
  $("ordem").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    ordem = b.dataset.o;
    [].forEach.call($("ordem").children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    desenhar();
  });
  $("btnSair").addEventListener("click", function () { try { sessionStorage.removeItem("madu-senha"); } catch (x) {} location.reload(); });

  async function entrar(senha, silencioso) {
    $("erro").hidden = true; $("btnEntrar").disabled = true;
    try {
      var dados = await abrir(senha);
      try { sessionStorage.setItem("madu-senha", senha); } catch (x) {}
      mostrar(dados);
    } catch (e) {
      if (!silencioso) {
        $("erro").textContent = e.message === "senha" ? "Senha incorreta. Tente de novo." :
          "Ainda não há dados publicados. Rode “Atualizar pedidos e publicar” na aba Actions do GitHub.";
        $("erro").hidden = false;
      }
    }
    $("btnEntrar").disabled = false;
  }
  $("form").addEventListener("submit", function (e) { e.preventDefault(); entrar($("senha").value, false); });
  try { var salva = sessionStorage.getItem("madu-senha"); if (salva) entrar(salva, true); } catch (x) {}
})();
</script>
</body>
</html>
