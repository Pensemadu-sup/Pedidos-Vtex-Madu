name: Atualizar pedidos e publicar

on:
  schedule:
    - cron: "3-58/5 11-23,0-1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, buscar-pedidos.mjs, ".github/workflows/atualizar.yml", "data/manuais.enc.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar pedidos na VTEX e criptografar
        env:
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APPKEY: ${{ secrets.VTEX_APPKEY }}
          VTEX_APPTOKEN: ${{ secrets.VTEX_APPTOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node buscar-pedidos.mjs

      - name: Montar o site
        run: |
          mkdir site
          cp index.html site/
          cp -r data site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
