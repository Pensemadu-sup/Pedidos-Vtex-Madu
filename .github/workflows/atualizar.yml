name: Atualizar pedidos e publicar

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - buscar-pedidos.mjs
      - .github/workflows/atualizar.yml
      - data/manuais.enc.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
        - uses: actions/checkout@v5
        with:
        fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar pedidos na VTEX e criptografar
        env:
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APPKEY: ${{ secrets.VTEX_APPKEY }}
          VTEX_APPTOKEN: ${{ secrets.VTEX_APPTOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node buscar-pedidos.mjs

      - name: Montar o site
        run: |
                    mkdir -p site
          cp index.html site/
          cp -r data site/
          for f in manifest.json pwa-register.js sw.js; do
            if [ -f "$f" ]; then cp "$f" site/; fi
          done
          if [ -d icons ]; then cp -r icons site/; fi
          N=$(git rev-list --count HEAD -- index.html)
          T=$(git log -1 --format=%cI -- index.html)
          printf '{"n":%s,"hora":"%s"}\n' "$N" "$T" > site/versao.json
          
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Publicar no GitHub Pages (2ª tentativa)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        
      - name: Avisar pedido novo no ntfy
        if: success() && hashFiles('aviso.json') != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC não configurado"; exit 0; fi
          jq -n --arg topic "$NTFY_TOPIC" --slurpfile a aviso.json \
            '{topic:$topic,title:$a[0].titulo,message:$a[0].mensagem,tags:["tada"],click:"https://pensemadu-sup.github.io/Pedidos-Vtex-Madu/"}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- https://ntfy.sh
